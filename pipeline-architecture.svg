<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Local Socratic Chat pipeline architecture</title>
  <desc id="desc">A diagram showing the browser connecting to the local platform gateway, which uses PostgreSQL and pgvector for persistence and retrieval, OpenAI embeddings for document and query vectors, and Ollama for local language model generation.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #fff; }
      .subtitle { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #dbeafe; }
      .label { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .body { font: 400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #334155; }
      .small { font: 600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .step { font: 700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #1d4ed8; }
      .box { stroke: #cbd5e1; stroke-width: 1.5; rx: 16; }
      .line { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#blueArrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <rect width="1400" height="116" fill="url(#header)"/>
  <text x="70" y="53" class="title">Local Socratic Chat Pipeline</text>
  <text x="70" y="83" class="subtitle">Browser → platform gateway → retrieval and local generation → grounded response</text>
  <rect x="1110" y="35" width="210" height="44" rx="22" fill="#ffffff" fill-opacity=".14" stroke="#93c5fd"/>
  <text x="1215" y="62" text-anchor="middle" class="subtitle">LOCAL • PORT 8000</text>

  <!-- Main request path -->
  <text x="70" y="153" class="step">1  USER REQUEST</text>
  <rect x="70" y="175" width="230" height="118" class="box" fill="#fff" filter="url(#shadow)"/>
  <circle cx="112" cy="218" r="24" fill="#dbeafe"/>
  <path d="M101 218c0-7 5-12 11-12s11 5 11 12-5 12-11 12-11-5-11-12zm-8 25c2-9 10-14 19-14s17 5 19 14" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="218" class="label">Browser</text>
  <text x="150" y="243" class="body">http://127.0.0.1:8000</text>
  <text x="91" y="278" class="small">Login • upload • ask a question</text>

  <path d="M300 234 H385" class="blue-line"/>
  <text x="342" y="220" text-anchor="middle" class="small">HTTP</text>

  <rect x="385" y="155" width="330" height="158" class="box" fill="url(#gateway)" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="415" y="194" class="label">Platform Gateway</text>
  <text x="415" y="220" class="body">FastAPI / Uvicorn</text>
  <text x="415" y="248" class="body">• authentication and sessions</text>
  <text x="415" y="271" class="body">• course and document APIs</text>
  <text x="415" y="294" class="body">• chat orchestration</text>

  <!-- Retrieval lane -->
  <text x="70" y="361" class="step">2  DOCUMENT INGESTION &amp; RETRIEVAL</text>
  <rect x="70" y="383" width="270" height="142" class="box" fill="#fff7ed" stroke="#fed7aa" filter="url(#shadow)"/>
  <text x="100" y="423" class="label">Course Documents</text>
  <text x="100" y="450" class="body">PDF / HTML / text files</text>
  <text x="100" y="477" class="body">Chunking and metadata</text>
  <text x="100" y="504" class="body">Evidence context</text>

  <path d="M340 454 H430" class="line"/>
  <text x="385" y="440" text-anchor="middle" class="small">chunks</text>

  <rect x="430" y="383" width="270" height="142" class="box" fill="#ecfdf5" stroke="#a7f3d0" filter="url(#shadow)"/>
  <text x="460" y="423" class="label">Embeddings</text>
  <text x="460" y="450" class="body">OpenAI text-embedding-3-small</text>
  <text x="460" y="477" class="body">Document vectors</text>
  <text x="460" y="504" class="body">Query vector for each question</text>

  <path d="M700 454 H790" class="line"/>
  <text x="745" y="440" text-anchor="middle" class="small">vector search</text>

  <rect x="790" y="383" width="280" height="142" class="box" fill="#f0fdf4" stroke="#bbf7d0" filter="url(#shadow)"/>
  <text x="820" y="423" class="label">PostgreSQL + pgvector</text>
  <text x="820" y="450" class="body">Local database: port 5434</text>
  <text x="820" y="477" class="body">socratic_chat schema</text>
  <text x="820" y="504" class="body">Top relevant course passages</text>

  <!-- Generation lane -->
  <text x="70" y="578" class="step">3  GROUNDED GENERATION</text>
  <rect x="70" y="600" width="300" height="142" class="box" fill="#eff6ff" stroke="#bfdbfe" filter="url(#shadow)"/>
  <text x="100" y="640" class="label">Prompt Assembly</text>
  <text x="100" y="667" class="body">Question + conversation history</text>
  <text x="100" y="694" class="body">Retrieved evidence + Socratic rules</text>
  <text x="100" y="721" class="body">Grounded tutor prompt</text>

  <path d="M370 671 H480" class="blue-line"/>
  <text x="425" y="657" text-anchor="middle" class="small">prompt</text>

  <rect x="480" y="600" width="320" height="142" class="box" fill="#fef2f2" stroke="#fecaca" filter="url(#shadow)"/>
  <text x="510" y="640" class="label">Ollama</text>
  <text x="510" y="667" class="body">Local LLM: 127.0.0.1:11434</text>
  <text x="510" y="694" class="body">qwen3.5:9b-q4_K_M</text>
  <text x="510" y="721" class="body">Socratic explanation / follow-up</text>

  <path d="M800 671 H910" class="blue-line"/>
  <text x="855" y="657" text-anchor="middle" class="small">answer</text>

  <rect x="910" y="600" width="330" height="142" class="box" fill="#fff" filter="url(#shadow)"/>
  <text x="940" y="640" class="label">Tutor Response</text>
  <text x="940" y="667" class="body">Short grounded explanation</text>
  <text x="940" y="694" class="body">Follow-up question when appropriate</text>
  <text x="940" y="721" class="body">Evidence context shown to learner</text>

  <!-- Gateway relationships -->
  <path d="M550 313 V383" class="line dashed"/>
  <text x="570" y="351" class="small">retrieval API</text>
  <path d="M670 313 V600 H640" class="line dashed"/>
  <text x="685" y="470" class="small">generation</text>
  <path d="M1060 525 V600 H910" class="line dashed"/>
  <text x="1080" y="568" class="small">evidence</text>

  <!-- Legend -->
  <rect x="1240" y="383" width="115" height="142" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="1260" y="414" class="small">LEGEND</text>
  <line x1="1260" y1="438" x2="1290" y2="438" class="blue-line"/>
  <text x="1298" y="442" class="small">request</text>
  <line x1="1260" y1="468" x2="1290" y2="468" class="line"/>
  <text x="1298" y="472" class="small">data</text>
  <line x1="1260" y1="498" x2="1290" y2="498" class="line dashed"/>
  <text x="1298" y="502" class="small">internal</text>
</svg>
