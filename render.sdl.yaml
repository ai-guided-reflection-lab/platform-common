# Add only SDL when Platform and Reflections already exist on Render.
services:
  - type: web
    name: cluball-sdl
    runtime: docker
    plan: free
    dockerfilePath: ./adaptive-learning-app/backend/Dockerfile
    dockerContext: ./adaptive-learning-app/backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PLATFORM_SERVICE_TOKEN
        sync: false
      - key: SELF_DIRECTED_LEARNING_DB_SCHEMA
        value: self_directed_learning
      - key: ADAPTIVE_PLATFORM_ONLY
        value: "true"
      - key: ADAPTIVE_DATA_DIR
        value: /tmp/sdl-data
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
