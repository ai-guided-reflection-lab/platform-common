services:
  backend:
    build: ./backend
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the root .env}
      DATABASE_SCHEMA: ${SELF_DIRECTED_LEARNING_DB_SCHEMA:-self_directed_learning}
      ADAPTIVE_DATABASE_PATH: ""
      ADAPTIVE_DATA_DIR: /data
      INSTRUCTOR_ORIGIN: http://127.0.0.1:5173
      STUDENT_ORIGIN: http://127.0.0.1:5174
    ports:
      - "8100:8100"
    volumes:
      - adaptive-data:/data

volumes:
  adaptive-data:
