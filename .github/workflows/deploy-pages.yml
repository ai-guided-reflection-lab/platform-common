name: Connect personal domain to ClubALL

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create platform redirect
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=https://cluball-platform-personal.onrender.com/platform/">
              <title>Opening ClubALL</title>
            </head>
            <body>
              <p>Opening the latest ClubALL platform…</p>
              <p><a href="https://cluball-platform-personal.onrender.com/platform/">Continue to ClubALL</a></p>
              <script>
                const destination = new URL("https://cluball-platform-personal.onrender.com/platform/");
                destination.search = window.location.search;
                destination.hash = window.location.hash;
                window.location.replace(destination);
              </script>
            </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
