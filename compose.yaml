services:
  database:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - database:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  platform:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PLATFORM_DB_SCHEMA: ${PLATFORM_DB_SCHEMA:-platform}
      SOCRATIC_DB_SCHEMA: ${SOCRATIC_DB_SCHEMA:-socratic_chat}
      REFLECTIONS_URL: http://reflections:8000
      TUTOR_URL: http://tutor:8080
    ports: ["8000:8000"]
    volumes:
      - socratic-index:/workspace/Socratic-Chat/backend/storage
      - socratic-documents:/workspace/Socratic-Chat/backend/data/raw_docs

  reflections:
    build: ./reflections-app/backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PLATFORM_DB_SCHEMA: ${PLATFORM_DB_SCHEMA:-platform}
      REFLECTIONS_DB_SCHEMA: ${REFLECTIONS_DB_SCHEMA:-reflections_app}
    depends_on:
      platform: {condition: service_started}
    volumes:
      - model-cache:/root/.cache/huggingface

  tutor:
    build: ./student-agent-bot
    env_file: .env
    environment:
      TUTOR_SESSION_DB: /data/sessions.sqlite3
    volumes:
      - tutor-sessions:/data

volumes:
  database:
  socratic-index:
  socratic-documents:
  tutor-sessions:
  model-cache:
