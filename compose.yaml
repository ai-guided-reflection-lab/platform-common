services:
  database:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - database:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  platform:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PLATFORM_DB_SCHEMA: ${PLATFORM_DB_SCHEMA:-platform}
      SOCRATIC_DB_SCHEMA: ${SOCRATIC_DB_SCHEMA:-socratic_chat}
      REFLECTIONS_URL: http://reflections:8000
      TUTOR_URL: http://tutor:8080
      SELF_DIRECTED_LEARNING_URL: http://self-directed-learning:8100
    ports: ["8000:8000"]
    volumes:
      - socratic-index:/workspace/Socratic-Chat/backend/storage
      - socratic-documents:/workspace/Socratic-Chat/backend/data/raw_docs
    depends_on:
      database: {condition: service_healthy}
      reflections: {condition: service_started}
      tutor: {condition: service_started}
      self-directed-learning: {condition: service_started}

  reflections:
    build: ./reflections-app/backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PLATFORM_DB_SCHEMA: ${PLATFORM_DB_SCHEMA:-platform}
      REFLECTIONS_DB_SCHEMA: ${REFLECTIONS_DB_SCHEMA:-reflections_app}
    depends_on:
      platform: {condition: service_started}
    volumes:
      - model-cache:/root/.cache/huggingface

  tutor:
    build: ./student-agent-bot
    env_file: .env
    environment:
      TUTOR_SESSION_DB: /data/sessions.sqlite3
    volumes:
      - tutor-sessions:/data

  self-directed-learning:
    build: ./adaptive-learning-app/backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@database:5432/cluball
      DATABASE_SCHEMA: self_directed_learning
      ADAPTIVE_UPLOAD_DIR: /data/uploads
      ADAPTIVE_PLATFORM_ONLY: "true"
    depends_on:
      database: {condition: service_healthy}
    volumes:
      - self-directed-uploads:/data/uploads

volumes:
  database:
  socratic-index:
  socratic-documents:
  tutor-sessions:
  self-directed-uploads:
  model-cache:
