services:
  - type: web
    name: socratic-chat-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG_PIPELINE_LOGS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: RAG_MODEL
        value: gpt-4.1-mini
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_CLASSIFIER_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_ANSWER_EVALUATION_MODEL
        value: openai/gpt-oss-120b
      - key: CLASSIFIER_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: REQUIRE_GITHUB_ACCOUNT
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://socratic-chat-api.onrender.com/api/auth/github/callback
      - key: FRONTEND_URL
        value: https://jamesonthehill.com/Socratic-Chat/
      - key: AUTH_MODE
        value: school_google
      - key: ALLOWED_GOOGLE_DOMAINS
        value: charlotte.edu
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_SESSION_MINUTES
        value: "60"
      - key: ALLOW_PASSWORD_LOGIN
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://jamesonthehill.github.io,https://jamesonthehill.com"
